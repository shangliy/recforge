[project]
name = "recforge"
version = "0.1.0"
description = "One protocol to train, evaluate, compare and evolve recommenders: classic, generative (TIGER/HSTU/OneRec) and LLM-based."
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "torch"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
recforge = "recforge.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["recforge*"]

[tool.setuptools.package-data]
recforge = ["templates/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
